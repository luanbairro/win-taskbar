name: Build WinTaskbar

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore WinTaskbar.sln

    - name: Build Project
      run: dotnet build WinTaskbar.sln --configuration Release --no-restore

    - name: Publish Single-File Executable
      run: |
        dotnet publish src/WinTaskbar/WinTaskbar.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained false `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinTaskbar-win-x64
        path: ./publish/*
